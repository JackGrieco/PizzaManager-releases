name: Problema
description: Qualcosa non funziona come dovrebbe
title: "[Problema] "
labels: ["bug"]
# Gli id dei campi sono anche i nomi con cui l'app precompila il modulo
# (lib/feedback-source.js). Nessuno può chiamarsi `body`: è un nome riservato
# di GitHub e su un modulo .yml viene buttato via in silenzio.
body:
  - type: markdown
    attributes:
      value: |
        Se la apri dal pannello **📣 Segnalazioni** dentro l'app, versione e
        sistema arrivano già compilati.
  - type: textarea
    id: descrizione
    attributes:
      label: Cosa succede
      description: Cosa ti aspettavi e cosa succede invece.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Come farlo succedere di nuovo
      placeholder: |
        1. apro una sessione Claude su…
        2. chiudo l'app
        3. riapro e…
    validations:
      required: false
  - type: input
    id: ambiente
    attributes:
      label: Versione e sistema
      description: La versione si legge in Help → Informazioni su PizzaManager.
      placeholder: PizzaManager 1.5.0 · macOS · con tmux
    validations:
      required: false
